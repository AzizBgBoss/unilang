<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>unilang</title>
<style>
:root{--bg:#f4f4f6;--fg:#1b1b1f;--card:#fff;--line:#d4d4da;--accent:#2f6fed;--muted:#6b6b76;--err:#c0392b;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#111114;--fg:#e8e8ee;--card:#1b1b20;--line:#33333b;--accent:#6b9bff;--muted:#9a9aa6;--err:#ff7b6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.4 system-ui,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:760px;margin:0 auto;padding:10px}
h1{font-size:18px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:10px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.row+.row{margin-top:8px}
button,.filebtn{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;user-select:none;-webkit-user-select:none}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.filebtn input{display:none}
.muted{color:var(--muted);font-size:13px}
#screen{display:flex;justify-content:center;align-items:center;background:#000;border-radius:8px;overflow:hidden}
#screen canvas{display:block;image-rendering:crisp-edges;image-rendering:pixelated;outline:none}
#stage{position:relative}
#pad{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;margin-top:10px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
#pad button{touch-action:none;min-width:56px;min-height:48px;padding:6px;font-size:15px}
#pad button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.dpad{display:grid;grid-template-columns:repeat(3,52px);grid-template-rows:repeat(3,46px);gap:3px;touch-action:none}
.dpad button{pointer-events:none;min-width:0;min-height:0;font-size:18px}
.dpad .up{grid-column:2;grid-row:1}
.dpad .left{grid-column:1;grid-row:2}
.dpad .right{grid-column:3;grid-row:2}
.dpad .down{grid-column:2;grid-row:3}
.mid{display:flex;gap:8px}
.mid button{border-radius:20px;min-width:72px;min-height:40px;font-size:13px}
.ab{display:flex;gap:10px;align-items:flex-end}
.ab button{width:62px;height:62px;border-radius:50%;font-weight:600;font-size:18px}
.ab .a{margin-bottom:26px}
#exitfs{display:none;position:absolute;top:calc(8px + env(safe-area-inset-top));right:calc(8px + env(safe-area-inset-right));z-index:2;opacity:.7}
#stage.fs{position:fixed;inset:0;z-index:100;background:#000;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
@media (orientation:portrait){#stage.fs{justify-content:flex-start;padding-top:max(env(safe-area-inset-top),8px)}}
#stage.fs #screen{border-radius:0}
#stage.fs #exitfs{display:block}
#stage.fs #pad{position:absolute;left:0;right:0;bottom:0;margin:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));pointer-events:none}
#stage.fs #pad>*{pointer-events:auto}
#stage.fs #pad button{background:rgba(255,255,255,.14);border-color:rgba(255,255,255,.35);color:#fff}
#stage.fs #pad button.on{background:rgba(255,255,255,.6);color:#000}
body.fsl{overflow:hidden}
@media (max-width:480px){#pad{flex-wrap:wrap}.mid{order:3;flex:1 0 100%;justify-content:center}}
#console{height:220px;overflow:auto;background:#0b0b0d;color:#d7d7de;border-radius:8px;padding:8px;font:12px/1.35 ui-monospace,Consolas,monospace;white-space:pre-wrap;word-break:break-word}
#console .err{color:#ff8f80}
#console .info{color:#7fb0ff}
label.chk{display:flex;gap:6px;align-items:center}
</style>
</head>
<body>
<main>
<h1>unilang</h1>

<div class="card">
  <div class="row">
    <label class="filebtn">Load ULC<input type="file" id="ulc"></label>
    <label class="filebtn">Load ULS<input type="file" id="uls"></label>
    <button id="dlsave" disabled>Download ULS</button>
  </div>
  <div class="row">
    <button id="run" class="primary" disabled>Run</button>
    <button id="stop" disabled>Stop</button>
    <button id="fs">Fullscreen</button>
    <label class="chk"><input type="checkbox" id="debug"> debug</label>
  </div>
  <div class="muted" id="status">No program loaded.</div>
</div>

<div class="card">
  <div id="stage">
    <div id="screen"><canvas id="canvas" width="256" height="128" tabindex="-1"></canvas></div>
    <button id="exitfs">Exit</button>
    <div id="pad">
      <div class="dpad">
        <button class="up" data-code="ArrowUp">&#9650;</button>
        <button class="left" data-code="ArrowLeft">&#9664;</button>
        <button class="right" data-code="ArrowRight">&#9654;</button>
        <button class="down" data-code="ArrowDown">&#9660;</button>
      </div>
      <div class="mid">
        <button class="act" data-code="Backspace">Select</button>
        <button class="act" data-code="Enter">Start</button>
      </div>
      <div class="ab">
        <button class="act b" data-code="KeyV">B</button>
        <button class="act a" data-code="KeyC">A</button>
      </div>
    </div>
  </div>
</div>

<div class="card">
  <div class="row" style="justify-content:space-between">
    <strong>Console</strong>
    <button id="clear">Clear</button>
  </div>
  <div id="console"></div>
</div>
</main>

<script>/*__UNILANG_JS__*/</script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var con = $('console'), runBtn = $('run'), stopBtn = $('stop'), dlBtn = $('dlsave'), statusEl = $('status');
  var ulc = null;        // {name, data}
  var uls = null;        // Uint8Array
  var inst = null;       // current Emscripten module
  var token = 0;         // invalidates callbacks of old runs
  var lastSave = null;   // last snapshot of the save file
  var curSavePath = null;
  var pollTimer = null;
  var lines = 0, MAX_LINES = 1500;
  var pending = [], flushRaf = 0;

  function flush() {
    flushRaf = 0;
    var atBottom = con.scrollHeight - con.scrollTop - con.clientHeight < 40;
    var frag = document.createDocumentFragment();
    for (var i = 0; i < pending.length; i++) {
      var d = document.createElement('div');
      if (pending[i][1]) d.className = pending[i][1];
      d.textContent = pending[i][0];
      frag.appendChild(d);
    }
    lines += pending.length;
    pending = [];
    con.appendChild(frag);
    while (lines > MAX_LINES) { con.removeChild(con.firstChild); lines--; }
    if (atBottom) con.scrollTop = con.scrollHeight;
  }
  // Batched per frame so a chatty program cannot stall the page.
  function log(text, cls) {
    pending.push([text, cls]);
    if (pending.length > MAX_LINES) pending.splice(0, pending.length - MAX_LINES);
    if (!flushRaf) flushRaf = requestAnimationFrame(flush);
  }

  function safeName(n) {
    n = (n || 'program.ulc').replace(/[^A-Za-z0-9._-]/g, '_');
    if (n.charAt(0) === '.') n = '_' + n;
    return n || 'program.ulc';
  }
  // Same rule as my_save_path() in main.c: replace the last extension with .uls
  function saveNameFor(n) {
    var i = n.lastIndexOf('.');
    return (i > 0 ? n.slice(0, i) : n) + '.uls';
  }
  function put(m, name, data) {
    if (m.FS_createDataFile) m.FS_createDataFile('/', name, data, true, true, true);
    else m.FS.writeFile('/' + name, data);
  }
  function setRunning(on) {
    stopBtn.disabled = !on;
    runBtn.disabled = !ulc;
  }
  var lastStat = '';
  function snapshot() {
    if (!inst || !curSavePath) return;
    try {
      var st = inst.FS.stat(curSavePath);
      var key = st.size + ':' + (+st.mtime);
      if (key === lastStat) return;      // unchanged, skip the copy
      lastStat = key;
      lastSave = inst.FS.readFile(curSavePath);
      dlBtn.disabled = false;
    } catch (e) { /* save file not created yet */ }
  }

  function stop(quiet) {
    if (!inst) return;
    snapshot();
    var m = inst;
    inst = null;
    token++;
    clearInterval(pollTimer);
    releaseAll();
    try { m._emscripten_force_exit(0); } catch (e) { /* already exited */ }
    setRunning(false);
    if (!quiet) log('[stopped]', 'info');
  }

  async function run() {
    if (!ulc) return;
    if (typeof createUnilang !== 'function') {
      log('Emscripten module missing. Run build.bat first.', 'err');
      return;
    }
    stop(true);
    var my = ++token;
    lastSave = null;
    lastStat = '';
    dlBtn.disabled = true;

    // fresh canvas so a new WebGL context never collides with the old one
    var old = $('canvas');
    var canvas = document.createElement('canvas');
    canvas.id = 'canvas';
    canvas.width = 256; canvas.height = 128;
    canvas.tabIndex = -1;
    canvas.addEventListener('webglcontextlost', function (e) { e.preventDefault(); });
    old.replaceWith(canvas);
    watchCanvas(canvas);
    schedule();

    var name = safeName(ulc.name);
    var args = [name];
    if ($('debug').checked) args.push('-debug');
    curSavePath = '/' + saveNameFor(name);
    statusEl.textContent = 'Running ' + name;
    stopBtn.disabled = false;
    runBtn.disabled = true;

    var opts = {
      canvas: canvas,
      arguments: args,
      print: function (t) { if (my === token) log(t); },
      printErr: function (t) { if (my === token) log(t, 'err'); },
      preRun: [function () {
        put(opts, name, ulc.data);
        if (uls) put(opts, saveNameFor(name), uls);
      }],
      onExit: function (code) {
        if (my !== token) return;
        snapshot();
        clearInterval(pollTimer);
        log('[exited with code ' + code + ']', 'info');
        statusEl.textContent = 'Finished ' + name;
        setRunning(false);
      }
    };
    try {
      var m = await createUnilang(opts);
      if (my !== token) { try { m._emscripten_force_exit(0); } catch (e) {} return; }
      inst = m;
      pollTimer = setInterval(function () { if (!document.hidden) snapshot(); }, 1000);
    } catch (e) {
      if (my === token) {
        log('Failed to start: ' + (e && e.message ? e.message : e), 'err');
        setRunning(false);
      }
    }
  }

  $('ulc').addEventListener('change', async function (e) {
    var f = e.target.files[0];
    if (!f) return;
    ulc = { name: f.name, data: new Uint8Array(await f.arrayBuffer()) };
    statusEl.textContent = 'ULC: ' + f.name + ' (' + f.size + ' bytes)' + (uls ? ' + ULS loaded' : '');
    runBtn.disabled = false;
  });
  $('uls').addEventListener('change', async function (e) {
    var f = e.target.files[0];
    if (!f) return;
    uls = new Uint8Array(await f.arrayBuffer());
    log('[ULS loaded: ' + f.name + ', ' + f.size + ' bytes; used on next Run]', 'info');
  });

  runBtn.addEventListener('click', run);
  stopBtn.addEventListener('click', function () { stop(false); });
  $('clear').addEventListener('click', function () { con.textContent = ''; lines = 0; pending = []; });

  dlBtn.addEventListener('click', function () {
    if (!lastSave) return;
    var blob = new Blob([lastSave], { type: 'application/octet-stream' });
    var url = URL.createObjectURL(blob);
    var a = document.createElement('a');
    a.href = url;
    a.download = saveNameFor(safeName(ulc ? ulc.name : 'program.ulc'));
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  });

  // ---- Layout: canvas follows the aspect ratio of the current screen mode ----
  // SDL sizes the canvas to wx*scale by wy*scale, so canvas.width/height carry the
  // mode's aspect ratio. We size it in whole device pixels per VM pixel so the
  // image stays sharp (no uneven pixel rows) on any screen or zoom level.
  var stage = $('stage'), screenEl = $('screen'), fsBtn = $('fs');
  var layoutRaf = 0, mo = null;
  function schedule() { if (!layoutRaf) layoutRaf = requestAnimationFrame(layout); }
  function layout() {
    layoutRaf = 0;
    var c = $('canvas');
    var bw = c.width, bh = c.height;
    if (!bw || !bh) return;
    var dpr = window.devicePixelRatio || 1;
    var fs = stage.classList.contains('fs');
    var portrait = window.innerHeight > window.innerWidth;
    var aw = fs ? window.innerWidth : screenEl.clientWidth;
    var ah = fs ? (portrait ? window.innerHeight * 0.6 : window.innerHeight)
                : Math.max(160, window.innerHeight * 0.7);
    var w = Math.min(aw * dpr, ah * dpr * bw / bh);
    // bw/5 is the smallest possible pixel unit across modes (scale 5 or 10 in main.c)
    var unit = bw % 5 === 0 ? bw / 5 : 0;
    w = unit && w >= unit ? Math.floor(w / unit) * unit : Math.floor(w);
    c.style.width = (w / dpr) + 'px';
    c.style.height = (w * bh / bw / dpr) + 'px';
  }
  function watchCanvas(c) {
    if (mo) mo.disconnect();
    mo = new MutationObserver(schedule);
    mo.observe(c, { attributes: true, attributeFilter: ['width', 'height'] });
  }
  watchCanvas($('canvas'));
  window.addEventListener('resize', schedule);
  window.addEventListener('orientationchange', schedule);
  if (window.visualViewport) window.visualViewport.addEventListener('resize', schedule);
  schedule();

  // ---- Fullscreen with touch overlay ----
  var apiFs = false;
  function fsElement() { return document.fullscreenElement || document.webkitFullscreenElement; }
  function setFs(on) {
    if (on === stage.classList.contains('fs')) return;
    stage.classList.toggle('fs', on);
    document.body.classList.toggle('fsl', on);
    var p;
    try {
      if (on) {
        var req = stage.requestFullscreen || stage.webkitRequestFullscreen;
        if (req) { apiFs = true; p = req.call(stage); }
      } else if (fsElement()) {
        apiFs = false;
        p = (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      }
    } catch (e) { /* CSS fullscreen still applies (e.g. iPhone Safari) */ }
    if (p && p.catch) p.catch(function () {});
    releaseAll();
    schedule();
  }
  function onFsChange() {
    if (!fsElement() && apiFs) { apiFs = false; setFs(false); }
  }
  document.addEventListener('fullscreenchange', onFsChange);
  document.addEventListener('webkitfullscreenchange', onFsChange);
  fsBtn.addEventListener('click', function () { setFs(true); });
  $('exitfs').addEventListener('click', function () { setFs(false); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') setFs(false); });

  // ---- Touch / pointer controls: synthetic keyboard events that SDL listens for ----
  // A = C, B = V, Select = Backspace, Start = Enter (same keys the VM reads).
  var KEYS = { ArrowUp: 'ArrowUp', ArrowDown: 'ArrowDown', ArrowLeft: 'ArrowLeft', ArrowRight: 'ArrowRight',
               KeyC: 'c', KeyV: 'v', Backspace: 'Backspace', Enter: 'Enter' };
  var KEYCODES = { ArrowUp: 38, ArrowDown: 40, ArrowLeft: 37, ArrowRight: 39, KeyC: 67, KeyV: 86, Backspace: 8, Enter: 13 };
  var held = {}, btnFor = {};
  Array.prototype.forEach.call(document.querySelectorAll('#pad [data-code]'), function (b) {
    btnFor[b.getAttribute('data-code')] = b;
  });
  function setKey(code, on) {
    if (!!held[code] === on) return;
    held[code] = on;
    window.dispatchEvent(new KeyboardEvent(on ? 'keydown' : 'keyup', {
      code: code, key: KEYS[code] || code, keyCode: KEYCODES[code], which: KEYCODES[code],
      bubbles: true, cancelable: true }));
    if (btnFor[code]) btnFor[code].classList.toggle('on', on);
  }
  function releaseAll() {
    Object.keys(held).forEach(function (c) { if (held[c]) setKey(c, false); });
  }
  window.addEventListener('blur', releaseAll);
  document.addEventListener('visibilitychange', function () { if (document.hidden) releaseAll(); });

  function bindAct(b) {
    var code = b.getAttribute('data-code'), id = null;
    b.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      id = e.pointerId;
      try { b.setPointerCapture(id); } catch (x) {}
      setKey(code, true);
    });
    ['pointerup', 'pointercancel'].forEach(function (t) {
      b.addEventListener(t, function (e) {
        if (e.pointerId !== id) return;
        e.preventDefault();
        id = null;
        setKey(code, false);
      });
    });
    b.addEventListener('contextmenu', function (e) { e.preventDefault(); });
  }
  Array.prototype.forEach.call(document.querySelectorAll('#pad .act'), bindAct);

  // D-pad is one touch area: slide a thumb across it to change direction or press diagonals.
  var dp = document.querySelector('.dpad'), dpId = null;
  function dpUpdate(e) {
    var r = dp.getBoundingClientRect();
    var x = (e.clientX - r.left - r.width / 2) / (r.width / 2);
    var y = (e.clientY - r.top - r.height / 2) / (r.height / 2);
    var t = 0.3;
    setKey('ArrowLeft', x < -t);
    setKey('ArrowRight', x > t);
    setKey('ArrowUp', y < -t);
    setKey('ArrowDown', y > t);
  }
  function dpRelease() {
    dpId = null;
    ['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].forEach(function (c) { setKey(c, false); });
  }
  dp.addEventListener('pointerdown', function (e) {
    e.preventDefault();
    dpId = e.pointerId;
    try { dp.setPointerCapture(dpId); } catch (x) {}
    dpUpdate(e);
  });
  dp.addEventListener('pointermove', function (e) {
    if (e.pointerId === dpId) { e.preventDefault(); dpUpdate(e); }
  });
  ['pointerup', 'pointercancel'].forEach(function (t) {
    dp.addEventListener(t, function (e) { if (e.pointerId === dpId) dpRelease(); });
  });
  dp.addEventListener('contextmenu', function (e) { e.preventDefault(); });
})();
</script>
</body>
</html>
